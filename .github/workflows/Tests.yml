name: Run Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    uses: stiwicourage/powershell-ci/.github/workflows/tests.yml@develop
    with:
      install-command: >-
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted;
        foreach ($name in 'NovaModuleTools', 'KeepAChangelog', 'PSScriptAnalyzer') {
        Install-Module -Name $name -Repository PSGallery -AllowPrerelease -Scope CurrentUser -Force -ErrorAction Stop }
      test-command: >-
        ./scripts/Invoke-ScriptAnalyzerCI.ps1; Invoke-NovaBuild; Invoke-NovaTest
      codescene-enabled: false
    secrets: inherit
