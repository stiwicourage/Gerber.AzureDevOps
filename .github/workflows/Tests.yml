name: Run Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    uses: stiwicourage/powershell-ci/.github/workflows/tests.yml@develop
    with:
      build-validation: false
      codescene-enabled: true
    secrets: inherit
